apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
    - {{ .Values.host }}
  parentRefs:
    - name: {{ .Release.Name }}
      namespace: {{ .Release.Namespace }}
      kind: ListenerSet
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.backend.name }}
          port: {{ .Values.backend.port }}
          weight: 1
